<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colun Studios</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      background-color: #050508;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Fondo abstracto canvas */
    #canvas-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Contenedor principal */
    .page-container {
      background: linear-gradient(to bottom, rgba(5, 5, 8, 0.2) 0%, rgba(5, 5, 8, 0.8) 50%, #050508 100%);
      min-height: 250vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px 20px 80px;
    }

    /* Sección Superior */
    .top-section {
      text-align: center;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Logo Estilo App (Squircle) */
    .app-logo {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 20px;
      background-color: #111;
      transition: transform 0.3s ease;
    }

    .app-logo:hover {
      transform: scale(1.05) rotate(2deg);
    }

    .main-title {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.4rem;
      color: #e0e0e0;
      margin-top: 10px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .community-title {
      font-size: 1.8rem;
      color: #ffffff;
      margin-top: 40px;
      margin-bottom: 20px;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }

    /* Botón de Roblox */
    .roblox-btn {
      display: inline-block;
      background: linear-gradient(135deg, #e11c1c, #9e0000);
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 800;
      text-decoration: none;
      padding: 18px 50px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(225, 28, 28, 0.4), 0 0 0 2px rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .roblox-btn:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 15px 35px rgba(225, 28, 28, 0.6), 0 0 15px rgba(255, 255, 255, 0.5);
      background: linear-gradient(135deg, #ff2a2a, #be0000);
    }

    /* Sección Video MP4 Personalizado */
    .video-section {
      margin-top: 50px;
      text-align: center;
      width: 100%;
      max-width: 600px;
    }

    .video-title {
      font-size: 1.3rem;
      color: #00f2fe;
      margin-bottom: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .video-container {
      position: relative;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #000;
      cursor: pointer;
    }

    .video-container video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Capa de Control Flotante en el Centro */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .video-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .play-btn-center {
      width: 80px;
      height: 80px;
      background: rgba(0, 242, 254, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .play-btn-center::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 15px 0 15px 26px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 6px;
    }

    .video-container:hover .play-btn-center {
      transform: scale(1.1);
      background: rgba(0, 242, 254, 1);
    }

    /* Sección Créditos */
    .credits-box {
      margin-top: 35px;
      padding: 15px 25px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      backdrop-filter: blur(5px);
    }

    .credits-title {
      font-size: 0.9rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .credits-name {
      font-size: 1.1rem;
      color: #ffffff;
      font-weight: 600;
    }

    /* Sección Inferior */
    .bottom-section {
      text-align: center;
      margin-top: 60vh;
    }

    .final-text {
      font-size: 3.5rem;
      font-weight: 900;
      color: #2a2a38;
      text-transform: lowercase;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
    }

    /* Botón flotante para volver arriba */
    .scroll-top-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 15px 25px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }

    .scroll-top-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .scroll-top-btn:hover {
      background: #ffffff;
      color: #000000;
      transform: translateY(-3px);
    }

    @media (max-width: 768px) {
      .app-logo {
        width: 100px;
        height: 100px;
        border-radius: 22px;
      }
      .main-title {
        font-size: 2.5rem;
        letter-spacing: 2px;
      }
      .subtitle {
        font-size: 1.1rem;
      }
      .community-title {
        font-size: 1.3rem;
      }
      .roblox-btn {
        font-size: 1.4rem;
        padding: 15px 35px;
      }
      .final-text {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Fondo animado -->
  <canvas id="canvas-bg"></canvas>

  <div class="page-container">
    <!-- Parte Superior -->
    <div class="top-section">
      <!-- Logo apuntando a logo.png -->
      <img src="logo.png" alt="Colun Studios Logo" class="app-logo">

      <h1 class="main-title">COLUN STUDIOS</h1>
      <p class="subtitle">no hay nada por ahora</p>

      <p class="community-title">Unanse a nuestra comunidad</p>
      <a href="https://www.roblox.com/share/g/127853389" target="_blank" rel="noopener" class="roblox-btn">Roblox</a>

      <!-- Video MP4 con Botón de Play Central -->
      <div class="video-section">
        <p class="video-title">Video recomendado</p>
        <div class="video-container" id="videoWrapper">
          <video id="myVideo" playsinline preload="metadata">
            <source src="video.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
          </video>
          <div class="video-overlay" id="videoOverlay">
            <div class="play-btn-center"></div>
          </div>
        </div>
      </div>

      <!-- Créditos -->
      <div class="credits-box">
        <div class="credits-title">Créditos</div>
        <div class="credits-name">095383user alias "tellmixd el aweonao"</div>
      </div>
    </div>

    <!-- Parte Inferior -->
    <div class="bottom-section">
      <div class="final-text">xd buena</div>
    </div>
  </div>

  <!-- Botón Volver arriba -->
  <button class="scroll-top-btn" id="scrollTopBtn">↑ Volver arriba</button>

  <script>
    // Lógica del Video MP4
    const videoWrapper = document.getElementById('videoWrapper');
    const myVideo = document.getElementById('myVideo');
    const videoOverlay = document.getElementById('videoOverlay');

    function toggleVideoPlay() {
      if (myVideo.paused) {
        myVideo.play();
        videoOverlay.classList.add('hidden');
      } else {
        myVideo.pause();
        videoOverlay.classList.remove('hidden');
      }
    }

    videoWrapper.addEventListener('click', toggleVideoPlay);

    myVideo.addEventListener('ended', () => {
      videoOverlay.classList.remove('hidden');
    });

    // Fondo animado canvas
    const canvas = document.getElementById('canvas-bg');
    if (canvas && canvas.getContext) {
      const ctx = canvas.getContext('2d');
      let width, height;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const blobs = [
        { x: Math.random() * width, y: Math.random() * height, vx: 0.8, vy: 0.6, radius: 350, color: '#4facfe' },
        { x: Math.random() * width, y: Math.random() * height, vx: -0.7, vy: 0.9, radius: 400, color: '#00f2fe' },
        { x: Math.random() * width, y: Math.random() * height, vx: 0.5, vy: -0.8, radius: 450, color: '#6b11ff' },
        { x: Math.random() * width, y: Math.random() * height, vx: -0.6, vy: -0.5, radius: 300, color: '#ff0844' }
      ];

      function animate() {
        ctx.clearRect(0, 0, width, height);

        blobs.forEach(blob => {
          blob.x += blob.vx;
          blob.y += blob.vy;

          if (blob.x < -100 || blob.x > width + 100) blob.vx *= -1;
          if (blob.y < -100 || blob.y > height + 100) blob.vy *= -1;

          const gradient = ctx.createRadialGradient(
            blob.x, blob.y, 0,
            blob.x, blob.y, blob.radius
          );
          gradient.addColorStop(0, blob.color);
          gradient.addColorStop(1, 'transparent');

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(blob.x, blob.y, blob.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(animate);
      }
      animate();
    }

    // Botón para volver arriba
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    if (scrollTopBtn) {
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
          scrollTopBtn.classList.add('visible');
        } else {
          scrollTopBtn.classList.remove('visible');
        }
      });

      scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
    }
  </script>

</body>
</html>
